name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VFLAGS: -no-parallel

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitlife

    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout Gitlife
        uses: actions/checkout@v7
        with:
          path: gitlife

      - name: Build V
        working-directory: .
        run: |
          make
          ./v symlink -githubci

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test
        run: v test .

      - name: Build
        run: v -prod -o gitlife .
