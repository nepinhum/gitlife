name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout Gitlife
        uses: actions/checkout@v7
        with:
          path: gitlife

      - name: Build V
        run: make

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test
        run: |
          cd gitlife
          ../v test .

      - name: Build
        run: |
          cd gitlife
          ../v -prod -o gitlife .
